# Builds and deploys examples/azure-functions-helloworld as an Azure Functions custom handler
# (zip deploy - see its own README for the manual equivalent and why this doesn't use a
# container). Requires repo secret AZURE_CREDENTIALS (a service principal JSON, e.g. from
# `az ad sp create-for-rbac --sdk-auth`) and repo variables AZURE_FUNCTIONAPP_NAME and
# AZURE_RESOURCE_GROUP; see examples/azure-functions-helloworld/README.md's "CI/CD" section.
# Until those are set, the job below is skipped (not failed) so this workflow merging doesn't
# break CI on its own.

name: Deploy Azure Functions helloworld

on:
  push:
    branches: [ "main" ]
    paths:
      - 'examples/azure-functions-helloworld/**'
      - 'azurefunctions/**'
      - 'envelope/**'
      - 'httpbinding/**'
      - 'httpstatus/**'
      - 'wire/**'
      - '*.go'
      - '.github/workflows/deploy-azure-functions-helloworld.yml'
  workflow_dispatch:

jobs:
  # `secrets` is NOT one of the contexts available to a job-level `if:` (only github/needs/vars/
  # inputs are), so gating the deploy job directly on `secrets.X != ''` made the whole workflow
  # fail to compile - it produced a failed run with zero jobs, not the intended skip. This tiny
  # gate job reads the secret in a step `env:`, where `secrets` IS available, and publishes a
  # plain boolean the deploy job can legally gate on.
  gate:
    runs-on: ubuntu-latest
    outputs:
      has_credentials: ${{ steps.check.outputs.has_credentials }}
    steps:
      - id: check
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          if [ -n "$AZURE_CREDENTIALS" ]; then
            echo "has_credentials=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_credentials=false" >> "$GITHUB_OUTPUT"
            echo "Deployment credentials are not configured; skipping the deploy job." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: gate
    if: ${{ needs.gate.outputs.has_credentials == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/azure-functions-helloworld

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build custom handler binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o handler .
          chmod +x handler

      - name: Package deployment zip
        run: zip -r ../../deploy.zip host.json Greet handler

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy zip to Function App
        run: |
          az functionapp deployment source config-zip \
            --name "${{ vars.AZURE_FUNCTIONAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --src ../../deploy.zip
