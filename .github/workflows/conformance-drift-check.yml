name: conformance-drift-check

# The language-neutral conformance fixtures are OWNED by the cross-language `benzene` repo
# (docs/specification/conformance/*.json). This repo carries a VENDORED snapshot under
# conformance/testdata/ so the test suite is self-contained with no submodule. This job keeps the
# snapshot honest: it fetches the canonical fixtures from benzene and fails if they differ.
#
# The check runs both ways on purpose. A vendored fixture that has drifted is the obvious half; a
# canonical fixture MISSING from the snapshot is the half that actually bites, because a runner
# cannot notice a fixture it was never given.
#
# It also verifies conformance/SPEC_VERSION, which used to be no more than a printed reminder. The
# pin is this repo's claim about WHICH canonical commit the snapshot was taken from, and a claim
# nothing checks is a claim that goes stale silently - it had, by thirteen commits. The other half
# of the blind spot, "a fixture nothing runs", is guarded from the test suite by
# conformance/fixture_coverage_test.go.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'   # weekly, catches drift introduced on the benzene side
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch canonical fixtures from benzene
        run: |
          set -euo pipefail
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/daniellepelley/Benzene.git /tmp/benzene
          git -C /tmp/benzene sparse-checkout set docs/specification/conformance
          mkdir -p /tmp/canonical
          cp /tmp/benzene/docs/specification/conformance/*.json /tmp/canonical/
          git -C /tmp/benzene rev-parse HEAD > /tmp/canonical-head
          # The pinned commit is usually older than HEAD and the clone above is shallow, so fetch it
          # explicitly - the SPEC_VERSION check needs both trees to compare.
          git -C /tmp/benzene fetch --depth 1 origin "$(tr -d '[:space:]' < conformance/SPEC_VERSION)" \
            2>/dev/null || true

      - name: Diff vendored snapshot against canonical
        run: |
          set -euo pipefail
          fail=0
          for f in conformance/testdata/*.json; do
            name=$(basename "$f")
            if [ ! -f "/tmp/canonical/$name" ]; then
              echo "::error file=$f::Vendored fixture $name no longer exists in benzene canonical"
              fail=1
              continue
            fi
            if ! diff -u "/tmp/canonical/$name" "$f" > /tmp/diff.txt; then
              echo "::error file=$f::Vendored fixture $name has drifted from benzene canonical"
              cat /tmp/diff.txt
              fail=1
            fi
          done
          for f in /tmp/canonical/*.json; do
            name=$(basename "$f")
            if [ ! -f "conformance/testdata/$name" ]; then
              echo "::error::Canonical fixture $name is missing from the vendored snapshot"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "Conformance fixtures have drifted from the canonical benzene spec."
            echo "Re-vendor: cp <benzene>/docs/specification/conformance/*.json conformance/testdata/"
            echo "and update conformance/SPEC_VERSION to the new benzene commit."
            exit 1
          fi
          echo "vendored fixtures match canonical ($(ls conformance/testdata/*.json | wc -l) files)"

      - name: Verify SPEC_VERSION names a real canonical commit with these fixtures
        # Deliberately NOT "pinned == canonical HEAD". Canonical main moves for reasons that have
        # nothing to do with this directory - work notes, the website, the mesh UI - and a pin
        # required to equal HEAD would turn every such commit into a red build here, training
        # everyone to ignore the check. The pin's job is provenance: it must name a real commit
        # whose conformance directory is the one we vendored. Being behind HEAD is fine and normal;
        # being behind HEAD *across a change to the fixtures* is what this catches, and the byte
        # diff above catches the rest.
        run: |
          set -euo pipefail
          canonical=$(cat /tmp/canonical-head)
          pinned=$(tr -d '[:space:]' < conformance/SPEC_VERSION)

          if [ "$pinned" = "$canonical" ]; then
            echo "SPEC_VERSION pins canonical HEAD ($canonical)"
            exit 0
          fi

          if ! git -C /tmp/benzene cat-file -e "$pinned^{commit}" 2>/dev/null; then
            echo "::error file=conformance/SPEC_VERSION::SPEC_VERSION pins $pinned, which is not a commit in benzene"
            echo "The pin must name a real canonical commit. Re-vendor and write the commit you took:"
            echo "  echo $canonical > conformance/SPEC_VERSION"
            exit 1
          fi

          pinned_tree=$(git -C /tmp/benzene rev-parse "$pinned:docs/specification/conformance")
          head_tree=$(git -C /tmp/benzene rev-parse "$canonical:docs/specification/conformance")
          if [ "$pinned_tree" != "$head_tree" ]; then
            echo "::error file=conformance/SPEC_VERSION::The fixtures changed between $pinned and canonical HEAD $canonical"
            echo ""
            echo "The byte diff above passed, so the working snapshot matches HEAD - but the pin names"
            echo "an older commit whose fixtures differ, so it no longer records where this snapshot"
            echo "came from. Move the pin forward:"
            echo ""
            echo "  echo $canonical > conformance/SPEC_VERSION"
            exit 1
          fi

          echo "SPEC_VERSION pins $pinned; its conformance tree is identical to canonical HEAD ($canonical)."
          echo "Behind HEAD by $(git -C /tmp/benzene rev-list --count "$pinned..$canonical" 2>/dev/null || echo '?') commit(s), none touching the fixtures - fine."
