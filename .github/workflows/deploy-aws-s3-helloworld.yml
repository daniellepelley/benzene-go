# Builds and deploys examples/aws-s3-helloworld as a container-image Lambda invoked by S3 event
# notifications (see its own README for the manual equivalent of every step here). Requires repo
# secrets AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY, and optionally repo variable AWS_REGION
# (defaults to us-east-1); see examples/aws-s3-helloworld/README.md's "CI/CD" section. Until those
# secrets are set, the job below is skipped (not failed) so this workflow merging doesn't break CI on
# its own.

name: Deploy AWS S3 helloworld

on:
  push:
    branches: [ "main" ]
    paths:
      - 'examples/aws-s3-helloworld/**'
      - 'awss3/**'
      - 'awslambda/**'
      - 'envelope/**'
      - 'wire/**'
      - '*.go'
      - '.github/workflows/deploy-aws-s3-helloworld.yml'
  workflow_dispatch:

jobs:
  # `secrets` is NOT one of the contexts available to a job-level `if:` (only github/needs/vars/
  # inputs are), so gating the deploy job directly on `secrets.X != ''` made the whole workflow
  # fail to compile - it produced a failed run with zero jobs, not the intended skip. This tiny
  # gate job reads the secret in a step `env:`, where `secrets` IS available, and publishes a
  # plain boolean the deploy job can legally gate on.
  gate:
    runs-on: ubuntu-latest
    outputs:
      has_credentials: ${{ steps.check.outputs.has_credentials }}
    steps:
      - id: check
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -n "$AWS_ACCESS_KEY_ID" ]; then
            echo "has_credentials=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_credentials=false" >> "$GITHUB_OUTPUT"
            echo "Deployment credentials are not configured; skipping the deploy job." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: gate
    if: ${{ needs.gate.outputs.has_credentials == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/aws-s3-helloworld

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: sam build
        run: sam build --use-container

      - name: sam deploy
        run: |
          sam deploy \
            --stack-name benzene-go-aws-s3-helloworld \
            --resolve-image-repos \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --region "${{ vars.AWS_REGION || 'us-east-1' }}"
