# Builds and deploys examples/aws-kafka-helloworld as a container-image Lambda triggered by an MSK
# `orders` topic (see its own README for the manual equivalent of every step here). Requires repo
# secrets AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY, repo variable MSK_CLUSTER_ARN (the existing
# MSK cluster to consume - this template does not create one), and optionally repo variable
# AWS_REGION (defaults to us-east-1); see examples/aws-kafka-helloworld/README.md's "CI/CD" section.
# Until those secrets/variables are set, the job below is skipped (not failed) so this workflow
# merging doesn't break CI on its own.

name: Deploy AWS Kafka helloworld

on:
  push:
    branches: [ "main" ]
    paths:
      - 'examples/aws-kafka-helloworld/**'
      - 'awskafka/**'
      - 'awslambda/**'
      - 'envelope/**'
      - 'wire/**'
      - '*.go'
      - '.github/workflows/deploy-aws-kafka-helloworld.yml'
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ secrets.AWS_ACCESS_KEY_ID != '' && vars.MSK_CLUSTER_ARN != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/aws-kafka-helloworld

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: sam build
        run: sam build --use-container

      - name: sam deploy
        run: |
          sam deploy \
            --stack-name benzene-go-aws-kafka-helloworld \
            --resolve-image-repos \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "MskClusterArn=${{ vars.MSK_CLUSTER_ARN }}" \
            --region "${{ vars.AWS_REGION || 'us-east-1' }}"
