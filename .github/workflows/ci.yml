# Builds, vets, and tests every module in this repo: a gofmt check, go vet, go build, go test
# -race -cover, and a cross-compile smoke check for each cloud example's actual deployment target
# (Lambda: linux/arm64, Azure/Cloud Run: linux/amd64) so a change that breaks cross-compilation for
# a target this runner's own GOOS/GOARCH can't build natively is still caught. See README.md for the
# local equivalent of each step.
#
# This is a multi-module repo (go.work), and `./...` does not cross a nested module boundary even in
# workspace mode, so every module has to be named on the command line. That list used to be written
# out by hand in three steps - and a hand-maintained list is a list that goes stale silently. It did:
# nine of the twenty-nine modules were missing from it, among them examples/azure-functions-mesh,
# whose descriptor test went on asserting the pre-role-inversion provider/consumer direction while
# CI stayed green. The list is now derived from go.work by the "workspace modules" step below, so a
# module is covered from the moment it joins the workspace.

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Pinned to 1.25 because the gcppubsubclient module's SDK (cloud.google.com/go/pubsub)
          # requires go >= 1.25; the root and other modules still declare go 1.24.7, so external
          # consumers of those are unaffected - only the workspace build (which compiles every
          # module, including gcppubsubclient) needs the newer toolchain.
          go-version: '1.25.0'

      - name: gofmt
        run: |
          set -euo pipefail
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: workspace modules
        # scripts/modules.sh is the single source of truth, shared with the commands in README.md,
        # so CI and a developer's local run cover exactly the same set. The count is echoed so a
        # run's log shows how much was covered.
        run: |
          set -euo pipefail
          mods=$(scripts/modules.sh)
          echo "covering $(printf '%s\n' $mods | wc -l) workspace modules:"
          printf '  %s\n' $mods
          echo "GO_MODULES=$mods" >> "$GITHUB_ENV"

      - name: go vet
        run: go vet $GO_MODULES

      - name: go build
        run: go build $GO_MODULES

      - name: go test
        run: go test $GO_MODULES -race -cover

      - name: cross-compile cloud examples
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/aws-lambda-helloworld ./examples/aws-lambda-helloworld
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/aws-dynamodb-helloworld ./examples/aws-dynamodb-helloworld
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/aws-kinesis-helloworld ./examples/aws-kinesis-helloworld
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/aws-kafka-helloworld ./examples/aws-kafka-helloworld
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/aws-s3-helloworld ./examples/aws-s3-helloworld
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/azure-functions-helloworld ./examples/azure-functions-helloworld
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/gcp-cloudrun-helloworld ./examples/gcp-cloudrun-helloworld
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/gcp-pubsub-helloworld ./examples/gcp-pubsub-helloworld
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/aws-sqs-consumer ./examples/aws-sqs-helloworld/consumer
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/aws-sqs-publisher ./examples/aws-sqs-helloworld/publisher
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/aws-sns-consumer ./examples/aws-sns-helloworld/consumer
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /tmp/aws-sns-publisher ./examples/aws-sns-helloworld/publisher
