# The three domain services: one image (benzene-k8smesh-service) deployed three times, each
# selecting its domain via MESH_SERVICE. Each Kubernetes Service carries the `benzene: "true"`
# label for documentation/future-proofing parity with benzene-dotnet's discovery-by-label shape —
# nothing in this port reads it (see ../README.md's "Divergence from .NET": this mesh is
# push-only, so there is no RBAC or label-selector discovery wired to it).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: benzene-mesh
spec:
  replicas: 1
  selector:
    matchLabels: { app: orders }
  template:
    metadata:
      labels: { app: orders }
    spec:
      containers:
        - name: orders
          image: benzene-k8smesh-service:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            - { name: MESH_SERVICE, value: orders }
            # Push register/heartbeat/traces/issues to the mesh's collector so the Fleet plane
            # populates. In-cluster the mesh Service is reachable by name in this namespace.
            - { name: MESH_COLLECTOR_ENVELOPE_URL, value: "http://mesh/benzene/invoke" }
            # Chain the next hop over HTTP: orders posts payment:take to the payments service's
            # wire-envelope endpoint, addressed by in-cluster DNS. Service port is 80, so no
            # :8080 here.
            - { name: DOWNSTREAM_MSG_URL, value: "http://payments/benzene/invoke" }
          readinessProbe:
            httpGet: { path: /benzene/health, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: benzene-mesh
  labels: { benzene: "true" }
spec:
  selector: { app: orders }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: benzene-mesh
spec:
  replicas: 1
  selector:
    matchLabels: { app: payments }
  template:
    metadata:
      labels: { app: payments }
    spec:
      containers:
        - name: payments
          image: benzene-k8smesh-service:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            - { name: MESH_SERVICE, value: payments }
            - { name: MESH_COLLECTOR_ENVELOPE_URL, value: "http://mesh/benzene/invoke" }
            # Second hop: payments posts shipment:book to the shipping service.
            - { name: DOWNSTREAM_MSG_URL, value: "http://shipping/benzene/invoke" }
          readinessProbe:
            httpGet: { path: /benzene/health, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: benzene-mesh
  labels: { benzene: "true" }
spec:
  selector: { app: payments }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping
  namespace: benzene-mesh
spec:
  replicas: 1
  selector:
    matchLabels: { app: shipping }
  template:
    metadata:
      labels: { app: shipping }
    spec:
      containers:
        - name: shipping
          image: benzene-k8smesh-service:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            - { name: MESH_SERVICE, value: shipping }
            - { name: MESH_COLLECTOR_ENVELOPE_URL, value: "http://mesh/benzene/invoke" }
            # Terminal hop: no DOWNSTREAM_MSG_URL — shipping has no further downstream.
          readinessProbe:
            httpGet: { path: /benzene/health, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: shipping
  namespace: benzene-mesh
  labels: { benzene: "true" }
spec:
  selector: { app: shipping }
  ports: [{ port: 80, targetPort: 8080 }]
