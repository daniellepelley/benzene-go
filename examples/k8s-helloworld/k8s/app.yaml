# One Deployment + Service for all three legs - HTTP, SQS, and Kafka all run in this one binary
# (see ../main.go). No bundled SQS/Kafka here: point QUEUE_URL and KAFKA_BROKERS at a real queue and
# cluster - SQS_ENDPOINT_URL is left UNSET so the AWS SDK falls through to its default credential
# chain, e.g. an IRSA role bound to serviceAccountName below. For a credential-free local run against
# LocalStack + a throwaway Kafka broker instead, see ../compose/docker-compose.yml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-helloworld
  namespace: k8s-helloworld
spec:
  replicas: 2
  selector:
    matchLabels: { app: k8s-helloworld }
  template:
    metadata:
      labels: { app: k8s-helloworld }
    spec:
      # serviceAccountName: k8s-helloworld   # bind this to an IRSA role with sqs:ReceiveMessage/
                                              # DeleteMessage on the queue below
      containers:
        - name: k8s-helloworld
          image: k8s-helloworld:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            - { name: PORT, value: "8080" }
            - name: QUEUE_URL
              value: "https://sqs.eu-west-1.amazonaws.com/<account-id>/greet"   # <- replace
            - name: KAFKA_BROKERS
              value: "kafka-bootstrap.kafka.svc.cluster.local:9092"   # <- replace
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-helloworld
  namespace: k8s-helloworld
spec:
  selector: { app: k8s-helloworld }
  ports: [{ port: 80, targetPort: 8080 }]
