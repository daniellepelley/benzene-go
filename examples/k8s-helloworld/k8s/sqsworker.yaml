# The SQS leg - a worker Deployment with no Service (nothing calls it; it calls out to SQS). No
# bundled SQS here: point QUEUE_URL at a real queue - SQS_ENDPOINT_URL is left UNSET so the AWS SDK
# falls through to its default credential chain, e.g. an IRSA role bound to serviceAccountName below.
# For a credential-free local run against LocalStack instead, see ../compose/docker-compose.yml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greet-sqsworker
  namespace: k8s-helloworld
spec:
  replicas: 1
  selector:
    matchLabels: { app: greet-sqsworker }
  template:
    metadata:
      labels: { app: greet-sqsworker }
    spec:
      # serviceAccountName: greet-sqsworker   # bind this to an IRSA role with sqs:ReceiveMessage/
                                               # DeleteMessage on the queue below
      containers:
        - name: greet-sqsworker
          image: k8s-helloworld-sqsworker:local
          imagePullPolicy: IfNotPresent
          env:
            - name: QUEUE_URL
              value: "https://sqs.eu-west-1.amazonaws.com/<account-id>/greet"   # <- replace
