# The HTTP leg - a normal Deployment + Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greet-api
  namespace: k8s-helloworld
spec:
  replicas: 2
  selector:
    matchLabels: { app: greet-api }
  template:
    metadata:
      labels: { app: greet-api }
    spec:
      containers:
        - name: greet-api
          image: k8s-helloworld-api:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            - { name: PORT, value: "8080" }
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: greet-api
  namespace: k8s-helloworld
spec:
  selector: { app: greet-api }
  ports: [{ port: 80, targetPort: 8080 }]
